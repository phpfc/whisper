[package]
name = "whisper"
version = "0.2.0"
edition = "2021"
description = "A simple, secure, and private P2P chat CLI with E2E encryption. Zero config required."
license = "MIT"
repository = "https://github.com/phpfc/whisper"
keywords = ["chat", "p2p", "cli", "encryption", "e2e"]
categories = ["command-line-utilities", "cryptography", "network-programming"]

[dependencies]
tokio = { version = "1.42", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
ring = "0.17"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
rand = "0.8"
argon2 = "0.5"
subtle = "2.5"
bs58 = "0.5"
if-addrs = "0.15.0"
portmapper = "0.20"
mainline = "8"
snow = "0.10"
serde_json = "1.0.154"
